// Types the Compose compiler treats as stable, wired into every module by the notekea.jvm convention plugin.
// Domain models reach composables as they are, without a UI wrapper, and read-only collections compare by equals.
// A domain class must stay immutable for this to be true: ArchitectureTest fails on a `var` in one.
app.notekea.*.domain.*
app.notekea.core.*.domain.*
kotlin.collections.*
