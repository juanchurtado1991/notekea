name: Installers (temporary)

on:
  push:
    branches:
      - tmp/installers

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            dir: msi
          - os: macos-latest
            task: packageDmg
            dir: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Package
        shell: bash
        run: ./gradlew :composeApp:${{ matrix.task }} --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: notekea-${{ matrix.dir }}
          path: composeApp/build/compose/binaries/main/${{ matrix.dir }}/*
          retention-days: 14
