name: Release

# A release (ROADMAP.md 5.3): a tag `v<major>.<minor>.<patch>` (`v1.0.0`) packages Notekea on Windows, macOS and Linux
# and publishes a GitHub release with the three installers and their SHA-256 checksums. The installers are not signed
# (5.3, "Unsigned builds"): the release notes link the README's "First launch" section. A pull request that changes
# this workflow builds the installers without publishing them, so the workflow is checked before a tag needs it.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The embedding model the app bundles (ROADMAP.md 2.2), 121 MB, downloaded once and kept by its SHA-256.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .gradle/models
          key: embedding-model-15691dfe830257f569a1e3521977351d16eac18e48e414908dc98ed9b8455e07

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # v1.2.3 → package version 1.2.3, which the installers need as plain numbers. A pull request builds as v0.0.1.
      - name: Version
        id: version
        shell: bash
        run: |
          name="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then name="v0.0.1"; fi
          if [[ ! "$name" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then echo "Not a release tag: $name"; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "package=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Package Notekea
        shell: bash
        run: >
          ./gradlew :app:packageDistributionForCurrentOS --console=plain
          -PpackageVersion=${{ steps.version.outputs.package }} -PreleaseName=${{ steps.version.outputs.name }}

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p installers
          find app/build/compose/binaries/main -type f \( -name "*.msi" -o -name "*.dmg" -o -name "*.deb" \) \
            -exec cp {} installers/ \;
          ls -l installers

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: installers/
          retention-days: 14

  publish:
    name: Publish the release
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      # One line per installer, as `sha256sum -c SHA256SUMS.txt` checks it.
      - name: Checksums
        working-directory: installers
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          readme="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#first-launch"
          cat > notes.md <<EOF
          | System | Installer |
          |---|---|
          | Windows | \`Notekea-*.msi\` |
          | macOS | \`Notekea-*.dmg\` |
          | Linux (Debian, Ubuntu, Pop!_OS) | \`notekea_*.deb\` |

          The installers are not signed yet, so the first time your system asks you to confirm that you want to open
          Notekea: [First launch](${readme}) shows what to click. \`SHA256SUMS.txt\` holds each installer's checksum.
          EOF
          gh release create "${GITHUB_REF_NAME}" installers/* --title "Notekea ${GITHUB_REF_NAME}" \
            --notes-file notes.md
