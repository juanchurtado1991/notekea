name: Nightly

# Every night, main on the three systems: the whole check, then the automated smoke runs with their memory samples
# (`smokeRun`, the workload of the performance passes), so a slow or flaky case shows up without waiting for a pull
# request. It can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Nightly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, test and coverage
        shell: bash
        run: ./gradlew check koverVerify --continue --console=plain

      - name: Smoke runs with memory
        if: always()
        shell: bash
        run: ./gradlew :selftest:smokeRun --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            selftest/build/reports/smoke-runs/
          retention-days: 14
