# Version updates: at most one grouped PR per ecosystem per month (see GUIDELINES.md §14).
# Security updates are a separate Dependabot feature enabled in the repository settings; they are not limited here.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major versions change APIs: upgraded manually, one at a time.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Kotlin, KSP, Compose and Ghost must move together: upgraded manually after checking compatibility.
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "org.jetbrains.compose*"
      - dependency-name: "com.ghostserializer*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - "*"
