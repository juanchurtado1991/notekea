org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

ksp.incremental=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The JDK modules the installers' runtime keeps (Notekea and Notekea QA); jlink leaves out every other one.
# `checkRuntimeModules` fails when the code needs one that is not here (issue #68: SQLite's driver needs java.sql).
notekea.runtimeModules=java.instrument,java.management,java.prefs,java.sql,jdk.security.auth,jdk.unsupported
